---
- name: Install Minikube with Docker on macOS and Linux
  hosts: all

  tasks:
    - name: Install dependencies on Debian/Ubuntu
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - conntrack
        state: present
      become: true
      when: ansible_os_family == "Debian"

    - name: Install Docker on Debian/Ubuntu
      ansible.builtin.apt:
        name: docker.io
        state: present
      become: true
      when: ansible_os_family == "Debian"

    - name: Start and enable Docker on Debian/Ubuntu
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      become: true
      when: ansible_os_family == "Debian"

    - name: Install Docker on macOS
      community.general.homebrew:
        name: docker
        state: present
      when: ansible_os_family == "Darwin"

    - name: Download Minikube binary for macOS
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-darwin-arm64
        dest: /usr/local/bin/minikube
        mode: "0755"
      become: true
      when: ansible_os_family == "Darwin"

    - name: Download Minikube binary for Linux
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"
      become: true
      when: ansible_os_family == "Debian"

    - name: Start Minikube with Docker
      ansible.builtin.command:
        cmd: minikube start --driver=docker
      register: minikube_start
      changed_when: "'Done' in minikube_start.stdout"

    - name: Display Minikube start status
      ansible.builtin.debug:
        var: minikube_start.stdout
